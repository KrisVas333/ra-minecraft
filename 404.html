<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Blokas nerastas · Žaidimų kūrėjai</title>
<link rel="icon" href="/ra-minecraft/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Poppins:wght@400;600&display=swap">
<script defer src="https://krisvas333.github.io/neuron-ar/track.js" data-brand="ra" data-artifact="minecraft-404" data-kind="landing"></script>
<script defer src="/ra-minecraft/track-consent.js"></script>
<style>
:root{--navy:#152039;--yellow:#FEC404;--yellow-2:#E0AB00;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0}
body{font:17px/1.6 Poppins,system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,#5B6CE0,#2F86E8);min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}
h1{font-family:'Pixelify Sans',monospace;font-weight:700;font-size:clamp(2rem,8vw,3.5rem);line-height:1.1}
p{color:#DCE6FF;margin:12px auto 24px;max-width:40ch}
img{width:120px;height:120px;margin:0 auto 18px;image-rendering:pixelated}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:14px 30px;border-radius:999px;background:var(--yellow);color:var(--navy);font-weight:600;text-decoration:none;box-shadow:0 6px 0 var(--yellow-2)}
.consent{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;background:#fff;color:var(--navy);border-radius:16px;padding:16px;box-shadow:0 20px 50px -14px rgba(0,0,0,.6);max-width:560px;margin-inline:auto;font-size:.92rem;line-height:1.5;text-align:left;transition:opacity .25s,transform .25s var(--ease)}
.consent.is-gone{opacity:0;transform:translateY(12px)}
.consent-actions{display:flex;gap:10px;margin-top:12px}
.consent .btn{flex:1;min-height:48px;padding:10px 16px;border:0;font:600 1rem Poppins,sans-serif;cursor:pointer;box-shadow:none}
.consent .btn-ghost{background:transparent;color:var(--navy);border:2px solid #C9D2EA}
</style>
</head>
<body>
<main>
  <img src="/ra-minecraft/assets/favicon.svg" alt="">
  <h1>Šito bloko čia nėra</h1>
  <p>Puslapis nerastas arba perkeltas. Grįžkite į būrelio puslapį ir įrašykite vaiką į laukiančiųjų sąrašą.</p>
  <a class="btn" href="/ra-minecraft/">Į būrelio puslapį</a>
</main>
</body>
</html>
